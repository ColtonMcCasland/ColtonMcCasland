<text class="f" x="80" y="31.5" font-size="12" font-weight="700" letter-spacing="3">FEATURED BUILD</text>
<text class="q" x="242" y="31.5" font-size="10" letter-spacing=".5">46 45 41 54 55 52 45 44 20 42 55 49 4C 44</text>
