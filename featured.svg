<svg xmlns="http://www.w3.org/2000/svg" width="800" height="266" viewBox="0 0 800 266" role="img" aria-labelledby="t d">
<title id="t">Raspipboy-3000</title>
<desc id="d">Featured build: a working Pip-Boy 3000 built around a Raspberry Pi and a 3.5 inch touchscreen. Python and pygame at 480 by 320, maps from OpenStreetMap. The Pi drives the touchscreen, two rotary encoders, three LEDs and audio out.</desc>
<defs><pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="q" width="1.4" height="6"/></pattern></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
.bg{fill:#0a0c0f}.bd{fill:none;stroke:#252a32}
.f{fill:#e9eef3}.d{fill:#e9eef3;fill-opacity:.52}.q{fill:#e9eef3;fill-opacity:.3}
.a{fill:#6fdcff}
.ln{fill:none;stroke:#e9eef3;stroke-opacity:.16}
.br{fill:none;stroke:#e9eef3;stroke-opacity:.7;stroke-width:1.5}
.bx{fill:#e9eef3;fill-opacity:.04;stroke:#e9eef3;stroke-opacity:.34}
.hl{fill:#6fdcff;fill-opacity:.22}
.pu{fill:none;stroke:#6fdcff;stroke-width:1.6}
@media (prefers-color-scheme:light){
.bg{fill:#f4f5f7}.bd{stroke:#d0d7de}
.f{fill:#0d1117}.d{fill:#0d1117;fill-opacity:.58}.q{fill:#0d1117;fill-opacity:.34}
.a{fill:#0a66d0}
.ln{stroke:#0d1117;stroke-opacity:.16}
.br{stroke:#0d1117;stroke-opacity:.75}
.bx{fill:#0d1117;fill-opacity:.03;stroke:#0d1117;stroke-opacity:.34}
.hl{fill:#0a66d0;fill-opacity:.16}
.pu{stroke:#0a66d0}
}
@keyframes blink{50%{opacity:0}}
.bk{animation:blink 1.4s step-end infinite}
.pu{stroke-dasharray:9 400;stroke-dashoffset:9;animation:pu 2.8s linear infinite}
@keyframes pu{to{stroke-dashoffset:-260}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
